<svg xmlns="http://www.w3.org/2000/svg" width="700" height="900" viewBox="0 0 700 900" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#111">Croqui do Chassi - Vista Superior</text>
  <text x="350" y="65" font-size="14" text-anchor="middle" fill="#555">Carrinho-robo - Replica Relampago McQueen</text>

  <!-- Chassis outline (200mm x 95mm scaled x4 -> 800x380, fit centered) -->
  <rect x="150" y="140" width="400" height="620" rx="30" fill="#f2f2f2" stroke="#333" stroke-width="3"/>

  <!-- Front label -->
  <text x="350" y="120" font-size="16" font-weight="bold" text-anchor="middle" fill="#c0392b">FRENTE</text>
  <text x="350" y="800" font-size="16" font-weight="bold" text-anchor="middle" fill="#2980b9">TRASEIRA</text>

  <!-- Front wheels (articulated) -->
  <rect x="100" y="190" width="40" height="90" rx="8" fill="#333"/>
  <rect x="560" y="190" width="40" height="90" rx="8" fill="#333"/>
  <text x="120" y="185" font-size="11" text-anchor="middle">Roda diant.</text>
  <text x="580" y="185" font-size="11" text-anchor="middle">Roda diant.</text>

  <!-- Rear wheels (fixed) -->
  <rect x="100" y="620" width="40" height="100" rx="8" fill="#000"/>
  <rect x="560" y="620" width="40" height="100" rx="8" fill="#000"/>
  <text x="120" y="740" font-size="11" text-anchor="middle">Roda tras.</text>
  <text x="580" y="740" font-size="11" text-anchor="middle">Roda tras.</text>

  <!-- Servo (front center) -->
  <rect x="290" y="190" width="120" height="60" rx="6" fill="#e67e22" stroke="#333"/>
  <text x="350" y="225" font-size="13" text-anchor="middle" fill="#fff">Servo SG90</text>
  <text x="350" y="240" font-size="11" text-anchor="middle" fill="#fff">(direcao)</text>

  <!-- Steering linkage -->
  <line x1="290" y1="220" x2="140" y2="235" stroke="#e67e22" stroke-width="4"/>
  <line x1="410" y1="220" x2="560" y2="235" stroke="#e67e22" stroke-width="4"/>

  <!-- Battery (center) -->
  <rect x="260" y="330" width="180" height="90" rx="6" fill="#27ae60" stroke="#333"/>
  <text x="350" y="370" font-size="13" text-anchor="middle" fill="#fff">Bateria LiPo</text>
  <text x="350" y="388" font-size="11" text-anchor="middle" fill="#fff">2S 7.4V</text>

  <!-- Arduino + driver (rear center) -->
  <rect x="240" y="460" width="220" height="100" rx="6" fill="#2980b9" stroke="#333"/>
  <text x="350" y="500" font-size="13" text-anchor="middle" fill="#fff">ESP32-WROOM-32</text>
  <text x="350" y="518" font-size="11" text-anchor="middle" fill="#fff">+ Driver TB6612FNG (Bluetooth)</text>
  <text x="350" y="536" font-size="10" text-anchor="middle" fill="#fff">(fixado sobre eixo traseiro)</text>

  <!-- Motor (rear, near axle) -->
  <rect x="290" y="600" width="120" height="60" rx="6" fill="#8e44ad" stroke="#333"/>
  <text x="350" y="626" font-size="13" text-anchor="middle" fill="#fff">Motor DC</text>
  <text x="350" y="642" font-size="11" text-anchor="middle" fill="#fff">N20 + reducao</text>

  <!-- Drive linkage -->
  <line x1="290" y1="630" x2="140" y2="660" stroke="#8e44ad" stroke-width="4"/>
  <line x1="410" y1="630" x2="560" y2="660" stroke="#8e44ad" stroke-width="4"/>

  <!-- Sensor de re (rear-facing) -->
  <rect x="300" y="770" width="100" height="30" rx="4" fill="#16a085" stroke="#333"/>
  <text x="350" y="790" font-size="11" text-anchor="middle" fill="#fff">Sensor re (HC-SR04)</text>

  <!-- Wiring channel note -->
  <text x="350" y="850" font-size="11" text-anchor="middle" fill="#777">Fiacao: canaletas laterais internas, afastada da barra de direcao</text>
  <text x="350" y="870" font-size="11" text-anchor="middle" fill="#777">Escala aproximada: 200mm (compr.) x 95mm (larg.)</text>
</svg>
